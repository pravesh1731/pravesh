<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/circle_image.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Pravesh Chaudhary — software developer building mobile and web apps with Flutter, Android, React and Node.js."
    />
    <meta name="theme-color" content="#ffffff" />
    <script>
      // Apply the saved (or system) theme before first paint to avoid a flash.
      try {
        const saved = localStorage.getItem("theme");
        const dark = saved ? saved === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
        if (dark) document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
    <title>Pravesh Chaudhary · Software Developer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
